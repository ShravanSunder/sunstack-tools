[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Sign before packaging so archive checksums cover the Developer ID signature.
macos-sign = true
# The installers to generate for each app
installers = ["shell", "homebrew", "npm"]
# A GitHub repo to push Homebrew formulas to
tap = "ShravanSunder/homebrew-taps"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Which actions to run on pull requests
pr-run-mode = "plan"
# The built-in cache also saves from tag builds. Use a restore-only setup hook;
# release-cache.yml warms matching dist-profile caches from main on input changes.
cache-builds = false
github-build-setup = "steps/release-build-setup.yml"
# This workflow adds an archive linkage gate after cargo-dist's build step,
# and pushes the formula with a deploy key instead of a token.
allow-dirty = ["ci"]
publish-jobs = ["homebrew", "npm"]

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"

[[dist.extra-artifacts]]
build = ["node", "scripts/release/export-lint-schema.ts"]
artifacts = ["target/sunstack.lint.schema.json"]
