## How to review the graph

Select a node to inspect its details and incoming consumers in **Used by**. Compare the current and proposed views, then hover over nodes or relationships to trace connections. Click an arrow to open its Connections evidence row. Sources provide quotations and links; they do not prove that a skill executes. This is a dated proposal, so proposed relationships do not mean the implementation has shipped.
