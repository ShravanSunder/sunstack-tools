## Reading guide

Start at **spec-design** in **Proposed**. Use grouped search to select another node; selection history lets you return to earlier choices. Switch **Current / Proposed** to compare the frozen source relationships with the proposed changes.

Hover or focus a node to trace related paths. Click an **arrow** to select its **Connections** evidence row, then read the quotation and source link. Inspect **incoming consumers** to see which nodes reference the selected node; these are declared relationships, not proof of runtime loading or assignment. Related tables supply the broader context.
