					# Heading navigation without a document wrapper

					This page deliberately uses the body fallback: no main or ex-document wrapper. A single ex-nav discovers asynchronously rendered Markdown headings without observing its own outline updates.

					## The proposal

					Keep session identity separate from the transport connection.

					### Ownership

					The registry owns the session. The socket carries messages.

					#### State transition

					An interrupted connection does not destroy the session.

					##### Reconnection rule

					Resume the same identity after validating the reconnect request.

					###### Observation

					Look for the same session identity before and after transport reconnection.

					## Next page
