name: S4 cancellation observation
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [exec, plain]
permissions: {}
env:
  S4_RELEASE_TAG: v0.0.7
  S4_RELEASE_COMMIT: 699a911e19218ac58a2340624fed4bf3d76220b3
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/demistify-setup
      - name: Download and authenticate the declared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ShravanSunder/sunstack-release-rehearsal
          mkdir -p bundle/assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$S4_RELEASE_TAG" > bundle/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$S4_RELEASE_TAG" > bundle/tag.json
          gh release download "$S4_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir bundle/assets
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          bundle = pathlib.Path('bundle')
          release = json.loads((bundle / 'release.json').read_text())
          tag = json.loads((bundle / 'tag.json').read_text())
          assert tag['object']['type'] == 'commit'
          assert tag['object']['sha'] == os.environ['S4_RELEASE_COMMIT']
          assert release['tag_name'] == os.environ['S4_RELEASE_TAG']
          assert release['prerelease'] is False
          digests = {}
          for asset in release['assets']:
              name = asset['name']
              assert pathlib.Path(name).name == name
              data = (bundle / 'assets' / name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              assert len(data) == asset['size'] and asset['digest'] == 'sha256:' + digest
              digests[name] = digest
          for line in (bundle / 'assets/sha256.sum').read_text().splitlines():
              if not line.strip():
                  continue
              digest, name = line.split(maxsplit=1)
              assert digests[name.lstrip('*')] == digest
          with tarfile.open(bundle / 'assets/sunstack-x86_64-unknown-linux-musl.tar.gz') as archive:
              members = archive.getmembers()
              assert len(members) <= 100 and sum(member.size for member in members) < 268435456
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert member.isfile() or member.isdir()
              binaries = [member for member in members if pathlib.PurePosixPath(member.name).name == 'sunstack' and member.isfile()]
              assert len(binaries) == 1 and binaries[0].size < 134217728
              native_bytes = archive.extractfile(binaries[0]).read()
          identity = {'tag': release['tag_name'], 'version': '0.0.7', 'release_commit': tag['object']['sha'],
                      'binary_sha256': hashlib.sha256(native_bytes).hexdigest(), 'asset_sha256': digests}
          (bundle / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
          cp scripts/verify/sunstack-rule/release-actions-control.ts bundle/
          cp scripts/verify/sunstack-rule/release-registry.ts bundle/
          cp scripts/verify/sunstack-rule/release-process.ts bundle/
          cp scripts/verify/sunstack-rule/release-records.ts bundle/
          mkdir -p bundle/node_modules
          cp -RL node_modules/zod bundle/node_modules/zod
          cp -R scripts/verify/sunstack-rule/release-fixtures/cancel bundle/fixture
          cp scripts/verify/sunstack-rule/release-fixtures/cancel.expected.json bundle/
      - uses: actions/upload-artifact@v7
        with:
          name: s4-cancellation-input
          path: bundle
          if-no-files-found: error
  cancellation:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: s4-cancellation-input
          path: ${{ runner.temp }}/s4-input
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Start the earlier-step controller and install from its mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/s4-actions"
          input="$RUNNER_TEMP/s4-input"
          mkdir -p "$root/home"
          cp -R "$input/fixture" "$root/fixture"
          cp "$input/identity.json" "$root/identity.json"
          node "$input/release-actions-control.ts" start --root "$root" --assets "$input/assets" --identity "$input/identity.json" --repository "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$GITHUB_WORKFLOW"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 's4-actions'
          inputs = pathlib.Path(os.environ['RUNNER_TEMP']) / 's4-input'
          ready = json.loads((root / 'ready.json').read_text())
          environment = {'PATH': '/usr/bin:/bin', 'HOME': str(root / 'home'),
                         'INSTALLER_DOWNLOAD_URL': ready['base'] + '/archives',
                         'SUNSTACK_UNMANAGED_INSTALL': str(root / 'installed'), 'SUNSTACK_NO_MODIFY_PATH': '1'}
          command = ['/bin/sh', str(inputs / 'assets/sunstack-installer.sh')]
          (root / 'install.command.json').write_text(json.dumps({'command': command, 'environment': environment}, indent=2) + '\n')
          result = subprocess.run(command, env=environment, capture_output=True, timeout=120)
          (root / 'install.stdout.log').write_bytes(result.stdout)
          (root / 'install.stderr.log').write_bytes(result.stderr)
          assert result.returncode == 0
          actual = hashlib.sha256((root / 'installed/sunstack').read_bytes()).hexdigest()
          assert actual == json.loads((root / 'identity.json').read_text())['binary_sha256']
          assert not list((root / 'home').iterdir())
          PY
      - name: Held native work
        env:
          S4_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/s4-actions"
          test "$S4_MODE" = exec || test "$S4_MODE" = plain
          group=$(ps -o pgid= -p $$ | tr -d ' ')
          printf '{"pid":%s,"group":%s,"binary":"%s/installed/sunstack"}\n' "$$" "$group" "$root" > "$root/work-step.json"
          cd "$root/fixture"
          if [ "$S4_MODE" = exec ]; then
            exec env -i PATH="$root/installed:/usr/bin:/bin" HOME="$root/home" OPENROUTER_API_KEY=SYNTHETIC_RUNNER_CONTROL_NOT_A_SECRET sunstack lint --all --format json
          fi
          env -i PATH="$root/installed:/usr/bin:/bin" HOME="$root/home" OPENROUTER_API_KEY=SYNTHETIC_RUNNER_CONTROL_NOT_A_SECRET sunstack lint --all --format json
      - name: Freeze evidence and clean only observed owned resources
        if: ${{ always() }}
        run: node "$RUNNER_TEMP/s4-input/release-actions-control.ts" finish "$RUNNER_TEMP/s4-actions"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: s4-cancellation-${{ inputs.mode }}
          path: ${{ runner.temp }}/s4-actions
          if-no-files-found: error
