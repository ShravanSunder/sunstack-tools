[workspace]
members = [
    "crates/sunstack-evidence",
    "crates/sunstack-decisions",
    "crates/sunstack-rules",
    "crates/sunstack",
    "crates/sunstack-lint",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
sunstack-evidence = { path = "crates/sunstack-evidence" }
sunstack-decisions = { path = "crates/sunstack-decisions" }
sunstack-rules = { path = "crates/sunstack-rules" }
sunstack-lint = { path = "crates/sunstack-lint" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
