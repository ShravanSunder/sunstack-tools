path = "tests/e2e/process_connected_evidence.rs"

[[test]]
name = "process_evidence_paths"
path = "tests/e2e/process_evidence_paths.rs"

[[test]]
name = "process_journeys"
path = "tests/e2e/process_journeys.rs"

[[test]]
