[package]
name = "sunstack"
description = "Lint repository documents and execute native Sunstack checks"
repository = "https://github.com/ShravanSunder/sunstack-tools"
homepage = "https://github.com/ShravanSunder/sunstack-tools"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Config for 'dist'
[package.metadata.dist]
# Customize the Homebrew formula name
formula = "sunstack"
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# The npm identity is separate from the installed sunstack command.
npm-scope = "@sunstack"
npm-package = "cli"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sunstack-rules.workspace = true
sunstack-lint.workspace = true
sunstack-decisions.workspace = true
sunstack-evidence.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "time"] }
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
security-framework = "3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
sunstack-decisions = { workspace = true, features = ["test-support"] }
sunstack-lint = { workspace = true, features = ["test-support"] }
sunstack-rules = { workspace = true, features = ["test-support"] }
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", features = ["process", "net", "sync"] }

[[bin]]
name = "sunstack"
path = "src/main.rs"

[[test]]
name = "evidence_selection_process"
path = "tests/e2e/evidence_selection_process.rs"

[[test]]
name = "hosted_journeys"
path = "tests/e2e/hosted_journeys.rs"

[[test]]
name = "hosted_request_diagnosis"
path = "tests/integration/hosted_request_diagnosis.rs"

[[test]]
name = "journey_measurements"
path = "tests/e2e/journey_measurements.rs"

[[test]]
name = "lint_commands"
path = "tests/e2e/lint_commands.rs"

[[test]]
name = "process_bounds"
path = "tests/e2e/process_bounds.rs"

[[test]]
name = "process_cancellation"
path = "tests/e2e/process_cancellation.rs"

[[test]]
name = "process_change_cancellation"
path = "tests/e2e/process_change_cancellation.rs"

[[test]]
name = "process_change_scopes"
path = "tests/e2e/process_change_scopes.rs"

[[test]]
