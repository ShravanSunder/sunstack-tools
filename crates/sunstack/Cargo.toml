[package]
name = "sunstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sunstack-rules.workspace = true
sunstack-decisions.workspace = true
sunstack-evidence.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "time"] }

[dev-dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", features = ["process", "net", "sync"] }

[[bin]]
name = "sunstack"
path = "src/main.rs"
