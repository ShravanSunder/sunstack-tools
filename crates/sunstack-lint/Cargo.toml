[package]
name = "sunstack-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sunstack-rules.workspace = true
sunstack-evidence.workspace = true
sunstack-decisions.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = "0.7"
globset = "0.4"
ignore = "0.4"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "=0.57.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
