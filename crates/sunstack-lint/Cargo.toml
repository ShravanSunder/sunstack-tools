[package]
name = "sunstack-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dependencies]
sunstack-rules.workspace = true
sunstack-evidence.workspace = true
sunstack-decisions.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = "0.7"
globset = "0.4"
ignore = "0.4"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
chrono = "0.4"

[dev-dependencies]
sunstack-lint = { path = ".", features = ["test-support"] }
sunstack-rules = { workspace = true, features = ["test-support"] }
tempfile = "3"
jsonschema = { version = "=0.57.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }

[[test]]
name = "judged_library"
path = "tests/integration/judged_library.rs"

[[test]]
name = "lint_library"
path = "tests/integration/lint_library.rs"

[[test]]
name = "rulebook_lint_gates"
path = "tests/integration/rulebook_lint_gates.rs"

[[test]]
name = "selection_failure_formats"
path = "tests/integration/selection_failure_formats.rs"

[[test]]
name = "config_diagnostic_paths"
path = "tests/integration/config_diagnostic_paths.rs"

[[test]]
name = "schema_limits_usage"
path = "tests/integration/schema_limits_usage.rs"
