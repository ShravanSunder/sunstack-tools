[package]
name = "sunstack-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sunstack-evidence.workspace = true
sunstack-decisions.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
schemars = { version = "1", features = ["chrono04"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
ast-grep-core = "=0.51.0"
ast-grep-language = "=0.51.0"
ast-grep-config = "=0.51.0"

[dev-dependencies]
git2 = { version = "=0.21.0", default-features = false }
tempfile = "3"
proptest = "1"
jsonschema = { version = "=0.57.0", default-features = false }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "test-util"] }
