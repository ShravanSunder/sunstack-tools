[package]
name = "sunstack-decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = ["tokio/net", "tokio/io-util"]

[lints]
workspace = true

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
schemars = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
sunstack-decisions = { path = ".", features = ["test-support"] }
proptest = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "test-util"] }

[[test]]
name = "hosted_jev"
path = "tests/integration/hosted_jev.rs"

[[test]]
name = "http_adapter"
path = "tests/integration/http_adapter.rs"

[[test]]
name = "backend_ceiling"
path = "tests/integration/backend_ceiling.rs"

[[test]]
name = "cancellation_contract"
path = "tests/integration/cancellation_contract.rs"

[[test]]
name = "diagnostic_privacy"
path = "tests/integration/diagnostic_privacy.rs"

[[test]]
name = "request_budget"
path = "tests/integration/request_budget.rs"
