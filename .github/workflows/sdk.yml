name: Sunstack SDK

# Build the TypeScript SDK's native addon on each declared platform, pack one
# candidate, and prove a fresh install compiles and runs in every cell.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/sdk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packages/sdk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunstack-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  SUNSTACK_CREDENTIAL_STORE: 'off'

jobs:
  contracts:
    name: Contracts, types and package tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-contracts
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Generated declarations match the Rust contracts
        run: |
          pnpm --filter @sunstack/sdk generate
          git diff --exit-code -- packages/sdk/src/contracts
      - name: Generation feature compiles cleanly
        run: cargo clippy --locked -p sunstack-sdk-native --features generation --all-targets -- -D warnings
      - name: Build this host's addon and the TypeScript package
        run: |
          pnpm --filter @sunstack/sdk build:native
          pnpm --filter @sunstack/sdk build:typescript
      - run: pnpm --filter @sunstack/sdk typecheck
      - run: pnpm --filter @sunstack/sdk lint
      - run: pnpm --filter @sunstack/sdk format:check
      - run: pnpm --filter @sunstack/sdk test

  addon:
    name: Addon (${{ matrix.cell }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: darwin-arm64, runner: macos-15, target: aarch64-apple-darwin, container: '' }
          - { cell: darwin-x64, runner: macos-15-intel, target: x86_64-apple-darwin, container: '' }
          - {
              cell: linux-x64-gnu,
              runner: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              container: '',
            }
          - {
              cell: linux-arm64-gnu,
              runner: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              container: '',
            }
          - {
              cell: linux-x64-musl,
              runner: ubuntu-22.04,
              target: x86_64-unknown-linux-musl,
              container: 'node:26-alpine',
            }
          - {
              cell: linux-arm64-musl,
              runner: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-musl,
              container: 'node:26-alpine',
            }
    steps:
      - name: Prepare Alpine build tools
        if: matrix.container != ''
        run: apk add --no-cache bash curl git build-base perl cmake python3 linux-headers
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust in the container
        if: matrix.container != ''
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust components and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Configure Apple SDK
        if: runner.os == 'macOS'
        run: |
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CC=/usr/bin/clang"
            echo "CFLAGS=-isysroot $(xcrun --show-sdk-path)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        if: matrix.container == ''
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Build the addon
        shell: bash
        run: node packages/sdk/scripts/build-native.ts --target ${{ matrix.target }}
      - name: Record the addon identity
        shell: bash
        run: |
          addon=packages/sdk/npm/${{ matrix.cell }}/sunstack-sdk.${{ matrix.cell }}.node
          file "$addon" || true
          if command -v sha256sum >/dev/null; then sha256sum "$addon"; else shasum -a 256 "$addon"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.cell }}
          path: packages/sdk/npm/${{ matrix.cell }}/sunstack-sdk.${{ matrix.cell }}.node
          if-no-files-found: error

  package:
    name: Pack one candidate
    needs: [contracts, addon]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: addons
      - name: Place each addon in its platform package
        run: |
          for cell in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            cp "addons/addon-$cell/sunstack-sdk.$cell.node" "packages/sdk/npm/$cell/"
          done
      - run: pnpm --filter @sunstack/sdk build:typescript
      - name: Pack the SDK and all six platform packages
        run: |
          node packages/sdk/scripts/pack-candidate.ts --out "$PWD/candidate" \
            --cell darwin-arm64 --cell darwin-x64 --cell linux-x64-gnu \
            --cell linux-arm64-gnu --cell linux-x64-musl --cell linux-arm64-musl | tee candidate/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-candidate
          path: candidate
          if-no-files-found: error

  install:
    name: Fresh install (${{ matrix.cell }})
    needs: [package]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: darwin-arm64, runner: macos-15, container: '' }
          - { cell: darwin-x64, runner: macos-15-intel, container: '' }
          - { cell: linux-x64-gnu, runner: ubuntu-22.04, container: 'node:26-bookworm' }
          - { cell: linux-arm64-gnu, runner: ubuntu-22.04-arm, container: 'node:26-bookworm' }
          - { cell: linux-x64-musl, runner: ubuntu-22.04, container: 'node:26-alpine' }
          - { cell: linux-arm64-musl, runner: ubuntu-22.04-arm, container: 'node:26-alpine' }
    steps:
      - name: Prepare Alpine checkout tools
        if: matrix.container == 'node:26-alpine'
        run: apk add --no-cache bash git
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: matrix.container == ''
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: sdk-candidate
          path: candidate
      - name: Consumer runs without a Rust toolchain
        shell: bash
        run: |
          # Hide any preinstalled Rust so the consumer cannot build or use it.
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -e '\.cargo/bin' -e 'rustup' | paste -sd ':' -)"
          if command -v rustc || command -v cargo; then echo "Rust is still on PATH" >&2; exit 1; fi
          node --version
          node packages/sdk/scripts/installed-consumer-check.ts --tarballs "$PWD/candidate" --evidence "$RUNNER_TEMP/consumer"
      - name: The installed addon matches this cell
        shell: bash
        run: |
          cd "$RUNNER_TEMP/consumer"
          node --input-type=module -e "import('@sunstack/sdk').then(async (sdk) => { const info = await sdk.contractInfo(); console.log(JSON.stringify(info)); if (info.kind !== 'ready') process.exit(1); })"
          ls node_modules/@sunstack
          test -d "node_modules/@sunstack/sdk-${{ matrix.cell }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-${{ matrix.cell }}
          path: ${{ runner.temp }}/consumer/*.log
          if-no-files-found: warn
