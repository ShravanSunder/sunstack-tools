name: Sunstack SDK

# Build the TypeScript SDK's native addon on each declared platform, pack one
# candidate, and prove a fresh install compiles and runs in every cell.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/sdk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packages/sdk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sunstack-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  SUNSTACK_CREDENTIAL_STORE: 'off'

jobs:
  contracts:
    name: Contracts, types and package tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-contracts
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Generated declarations match the Rust contracts
        run: |
          pnpm --filter @sunstack/sdk generate
          git diff --exit-code -- packages/sdk/src/contracts
      - name: Generation feature compiles cleanly
        run: cargo clippy --locked -p sunstack-sdk-native --features generation --all-targets -- -D warnings
      - name: Build this host's addon and the TypeScript package
        run: |
          pnpm --filter @sunstack/sdk build:native
          pnpm --filter @sunstack/sdk build:typescript
      - run: pnpm --filter @sunstack/sdk typecheck
      - run: pnpm --filter @sunstack/sdk lint
      - run: pnpm --filter @sunstack/sdk format:check
      - run: pnpm --filter @sunstack/sdk test

  addon:
    name: Addon (${{ matrix.cell }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: darwin-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { cell: linux-x64-gnu, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { cell: linux-arm64-gnu, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust components and target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Configure Apple SDK
        if: runner.os == 'macOS'
        run: |
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CC=/usr/bin/clang"
            echo "CFLAGS=-isysroot $(xcrun --show-sdk-path)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Build the addon
        run: node packages/sdk/scripts/build-native.ts --target ${{ matrix.target }}
      - name: Record the addon identity
        run: |
          addon=packages/sdk/npm/${{ matrix.cell }}/sunstack-sdk.${{ matrix.cell }}.node
          file "$addon" || true
          if command -v sha256sum >/dev/null; then sha256sum "$addon"; else shasum -a 256 "$addon"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.cell }}
          path: packages/sdk/npm/${{ matrix.cell }}/sunstack-sdk.${{ matrix.cell }}.node
          if-no-files-found: error

  package:
    name: Pack one candidate
    needs: [contracts, addon]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: addons
      - run: pnpm --filter @sunstack/sdk build:typescript
      - name: Pack the SDK and every supported addon
        shell: bash
        run: |
          cells=$(node --input-type=module -e "import { platformCells } from './packages/sdk/src/native-binding.ts'; console.log(platformCells.map(({key}) => key).join(' '))")
          args=()
          for cell in $cells; do
            cp "addons/addon-$cell/sunstack-sdk.$cell.node" "packages/sdk/npm/$cell/"
            args+=(--cell "$cell")
          done
          mkdir -p candidate
          node packages/sdk/scripts/pack-candidate.ts --out "$PWD/candidate" "${args[@]}" > candidate/manifest.json
          cat candidate/manifest.json
      - name: Dry-run all four public packages and validate their contents
        id: publish-dry-run
        background: true
        run: node packages/sdk/scripts/check-packages.ts --tarballs "$PWD/candidate" > candidate/package-checks.json
      - name: Wait for package checks
        wait-all:
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-candidate
          path: candidate
          if-no-files-found: error

  install:
    name: Fresh install (${{ matrix.cell }})
    needs: [package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: darwin-arm64, runner: macos-15 }
          - { cell: linux-x64-gnu, runner: ubuntu-22.04 }
          - { cell: linux-arm64-gnu, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sdk-candidate
          path: candidate
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Fresh consumer runs without a Rust toolchain
        run: |
          # Hide any preinstalled Rust so the consumer cannot build or use it.
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -e '\.cargo/bin' -e 'rustup' | paste -sd ':' -)"
          if command -v rustc || command -v cargo; then echo "Rust is still on PATH" >&2; exit 1; fi
          node --version
          node packages/sdk/scripts/installed-consumer-check.ts --tarballs "$PWD/candidate" --evidence "$RUNNER_TEMP/consumer"
          node packages/sdk/scripts/installed-consumer-check.ts --print-contract --evidence "$RUNNER_TEMP/consumer" --expect-cell ${{ matrix.cell }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-${{ matrix.cell }}
          path: ${{ runner.temp }}/consumer/*.log
          if-no-files-found: warn
