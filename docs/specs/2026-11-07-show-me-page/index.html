    <h1>Read the work through stories</h1>
    <p>Design draft: shared story presentation and Map behavior over agent-authored content. These target contracts are not released components.</p>
    <ex-markdown id="requirements" label="Requirements"><script type="application/json" data-ex-markdown-source="">{"text":"# Read the work through stories\n\nThe owner should be able to read what happened, what it means for him and what comes next, then open the supporting record or use the Map to reach another story. Agents should compose that same experience with Demistify, without carrying a private UI implementation into every page.\n\nThis is one coupled reader experience, released and checked as a whole. Story, section and Map needs remain rows in one document: none has a separate reader, authority or release boundary that earns a document split.\n\n```mermaid\nflowchart TD\n  A[Read a short story] --> B[Understand its meaning]\n  B --> C[Open More or the record]\n  B --> D[Open Map]\n  D --> E[Choose another story]\n  E --> A\n```\n\n## The approved reference\n\nThe design-documents Lead's 7 November commission quotes the owner: “ok i think we good and this is the deisgn i wnat we can start getting it deploeyd with eh demsitfy lead and then make sure its veirfied so we can star tkusign it”. The frozen reference is `p1b-approved-2026-11-07.html`, SHA-256 `ece32b0cdb2a6fe432f0db763ebdd7e55b885f43114e9a36cc555584d7f676c4`. Its page appearance, native folds and Map are the target; its historical story claims are supplied content, not assertions about current work.\n\nOne later correction governs the frozen file: the panel title and accessible name are **Map**, replacing **Outline**. Basis: the owner's “its more a Map no nto otulien”, confirmed by the commissioning Lead in Router push `01a1b60d-e12c-7180-a6fe-8bbef31fca40`. The reference's executable file has not been edited.\n\nThe 7 November shortcut addition also governs U3: the owner asked “whats the shorcut to map liek ocmments”, then “maybe m fo rmap”. His design-documents Lead recorded this in owner-decision row `01a1b74b-a7ef-7ee0-9844-02621be6e5ec`, project `01a1635f-5d9d-70e4-bfc7-6d96c1a210e7`, and relayed it in pushes `01a1b749-e306-7e62-92e3-e47b77f4814b` and `01a1b74b-da9e-7ee1-a6c2-94d03ddff4c0`. The Map is opened or closed by its button or M, using the same protected-input policy as the existing Comments C shortcut. This adds no second panel or state owner.\n\nThe UI view is the approved desktop page with Map closed and the narrow page with Map open, supplied as inert PNGs `approved-1400-map-closed.png` and `approved-400-map-open.png`. They show the compact story title and metadata, headline, labelled rows, showpiece, closed record fold, category section header and right Map panel. The narrow capture has the old Outline header; the correction above takes precedence. Captures describe appearance, not new interaction observations.\n\n## Who needs this\n\nThe direct reader is the owner, who has already selected this page. The author is an agent carrying story rows and their supporting log entries onto a local HTML page. The design-documents Lead owns the story content and group membership. Library maintainers own reusable rendering, public syntax and reader interaction; they do not interpret a log's meaning.\n\n| Need | Authorized outcome and why | Basis | Priority |\n| --- | --- | --- | --- |\n| U1 | Read each story's headline and Happened / For you / Next rows, with a subject, time and icon; read its showpiece and open More and supporting records without losing the story. | Commission §1 and approved page | Required by owner |\n| U2 | Scan four named sections while their headers remain visible below the toolbar; use accurate counts and page/section expand/collapse actions, with routine stories grouped under one smaller-stories fold. | Commission §2; page-wide action in frozen page | Required by owner |\n| U3 | Reach a story from one Map tree, with part states, without fighting Comments or landing on a closed story covered by the phone panel. | Commission §3 and frozen interaction code | Required by owner |\n| U4 | Recognize an in-page jump and start selected tree branches folded using documented Markdown, independently of following links. | Commission §4 and first tree request, Router push `01a1b602-57db-7092-97b9-b8cafa97138e` | Required by owner |\n| U5 | Compose the approved page from shared components, retaining supplied rich content, IDs, groups and log entries, without custom CSS or interaction scripts. | Commission introduction/§5; boundary confirmed in push `01a1b605-b613-7561-bb94-a6ad976df4c0` | Required by owner |\n| U6 | Start using a page only after the components, guide and actual released-only composition have been independently checked against the approved page. | Commission “Verified before use” and “Return” | Required by owner |\n\nAll six rows are authorized from the commission's quoted owner direction and frozen design. Source code is observational evidence about reuse and gaps, never authority to narrow these outcomes.\n\n## What stays outside\n\nThere is no Router reader, story database, automatic summarizer, importance classifier or log-to-story builder in the library. Agents author the content and explicit membership. The library owns the repeated presentation and interaction. Existing bottom workspaces retain their separate behavior beside Comments; making the Map mutually exclusive does not remove that ability.\n\nThe work uses native HTML, Markdown and the existing shared theme. It introduces no application framework or backend. Private real entries remain in the owner's private page; public demos use representative sanitized material. A page's design fidelity does not certify the truth of historical text supplied to it.\n\nThe four sections remain: For you to decide; What's done / what's next; What changed and why; What was verified, and what was missed. The changed section retains the two decision columns. The existing prototype's shorter displayed “What was verified” label is understood as that same section; content meaning is preserved.\n\n## What decides success\n\nThe reusable page must retain the frozen design's story hierarchy, states and navigation outcomes with the named Map correction, at 1280 and 420 CSS pixels. Shared-component checks also cover the repository's 390 CSS-pixel width and affected light/dark themes. Independent library review precedes Terra's evaluation of a page composed only from released Demistify parts. Source checks, a copied prototype or an HTTP response alone cannot establish that outcome.\n\nContinue with the [observable contract](specification.md). Exact implementation owners belong to Program Design and the proof route to Verification Design; both are pending and listed in the [set entry](index.md).\n","reference":"./requirements.md"}</script></ex-markdown>
    <ex-markdown id="specification" label="Specification"><script type="application/json" data-ex-markdown-source="">{"text":"# Stories stay readable and reachable\n\nThe reader sees a story before its evidence. The Map takes them to another story, opening what is needed to read it. The page author supplies every meaning and identity; Demistify supplies shared presentation and interaction.\n\nAuthority and the accepted needs U1–U6 are in [Requirements](requirements.md). The problem is not missing story data: the approved page works through private styling and executable page code that other agents cannot reuse as a documented library contract. The desired outcome is the same experience through shared parts.\n\n```mermaid\nflowchart TD\n  P[Page] --> S[Four sections]\n  S --> T[Stories]\n  T --> E[Folded entries]\n  M[Map tree] --> T\n```\n\nThe Map reaches a story by its stable ID. Stories can be open or folded; their entries remain folded until chosen.\n\n## The things the reader can name\n\n| Entity | Identity and relationships | Invariants and observable states | Basis |\n| --- | --- | --- | --- |\n| E1 Page | One authored HTML document. Contains four E2 sections and zero or one commissioned E5 Map. | Content identities remain unique. Local, prepared and released bindings are distinguished; none implies content acceptance. | U2, U5, U6 |\n| E2 Section | One explicitly named group on E1 with a stable authored identity; contains zero or more E3 stories and optionally a routine-stories group. | Membership is authored, not inferred from status or importance. Header count separates primary and routine membership; Map names the total. The changed section also contains two authored decision columns. | U2 |\n| E3 Story | One authored account identified by its stable page ID; moving it or changing its text does not create a second identity. Belongs to one section and can link to one or more E4 entries. | Has a title, subject/time/icon, headline and three named rows; open or folded. Optional showpiece and More preserve supplied meaning. A state icon does not prove completion. | U1, U3, U5 |\n| E4 Record entry | One supplied log entry identified by its supplied entry ID. It is referenced from stories; on the page its full content has one anchor. | Text is not summarized or reclassified by the renderer. It is folded initially and opens independently; navigation does not open unrelated entries. | U1, U5 |\n| E5 Map | The page's explicitly authored hierarchy of parts, sections and story links. A branch remains the same branch when folded. Its destinations reference E3 identities. | Closed or open; branches open or folded; the right panel and Comments are never both open. Heading and accessible name are Map. | U3, U4 |\n| E6 Disclosure | An authored fold containing a story, More, a record list, an individual record entry or routine stories; its identity is its authored element, not its title text. | Native open/closed state is authoritative. All five of these fold kinds participate in bulk actions within their declared scope. Other page notes and Map branches do not. Counts and action labels follow the live member state. | U1, U2, U3 |\n\n## Contract and proof obligations\n\nThe 7 November U3 shortcut addition extends R5/C5: M toggles the same Map as its button. Like Comments C, it ignores an already prevented event, composing input, repeats, Meta/Ctrl/Alt combinations and editable input/textarea/select/contenteditable/textbox targets; uppercase M is accepted. It can replace Comments when focus is not editing, and C can replace Map through the existing shared panel. No Map on a page means no M action. The Map trigger exposes the shortcut accessibly. Ordinary key behavior in protected targets remains native.\n\nEach R row is an independent pass/fail obligation. Its C identifier names the observable contract in that row; its V identifier names the authoritative proof obligation, not a chosen test route.\n\n| Obligation | Required observable behavior and failure case | Need / entities | Contract / proof obligation |\n| --- | --- | --- | --- |\n| R1 Story hierarchy | Each E3 shows its title, subject/time/icon and bold headline, followed by Happened, For you and Next with icons. It carries at most one showpiece, optional More, and “The record: N entries”. Rich supported body content retains its text, links and meaning. Missing optional content creates no empty decorative panel. | U1, U5; E3, E4 | C1; V1: same hierarchy and content against frozen reference at required widths/themes. |\n| R2 Initial states | Newly composed stories start open; their More, record list and entry disclosures start closed. Explicit carried open/closed states retain their supplied meaning. A general composition default cannot silently change a carried state. | U1, U5; E3, E4, E6 | C2; V2: first-load states and carried-state control agree with supplied markup. |\n| R3 Section scan | Each E2 has its named section header, primary count plus a separate routine count when present (for example “4 + 2 smaller”), and right-aligned icon-only bulk control. Its Map branch shows the total (6 in that example). The header stays below the actual page toolbar as stories scroll. One “N smaller” fold at the end of the section contains all authored routine members; the changed section also includes both authored decision columns. Long labels wrap without covering controls. | U2; E1, E2, E3, E6 | C3; V3: all four sections, split/total counts, end-position routine fold, columns and sticky behavior against reference; no viewport clipping or control overlap at 1280/420/390. |\n| R4 Bulk state | Page and section controls expand/collapse every story, More, record list, individual record entry and smaller-stories fold in their declared scope. Ordinary page notes such as “Names used here” and “About this page” are excluded. Mixed state offers expansion; all-open state offers collapse. Manual changes and another bulk control immediately affect that action state. An action never changes an outside section or the Map's branch state. Double-down expands and double-up collapses. | U2; E2, E6 | C4; V4: action, icon and accessible name agree with every listed member's actual state, including the initial mixed state, manual and cross-scope sequences. |\n| R5 Map presentation | The Map button sits in the shared reader control row; E5 opens at the right, with the same presentation/animation family as Comments. Opening either closes the other. On a narrow screen Map covers the page below the toolbar and has usable width; Escape/Close return focus. Existing bottom workspaces retain their established independent Comments behavior. | U3; E1, E5 | C5; V5: Map/Comments exclusion both orders, keyboard/focus, reduced motion and required viewport geometry. |\n| R6 Map destinations | Following an E5 link reveals the target E3 and any closed containing E6 group before scrolling. On a narrow screen Map closes first. An already-current fragment can be activated again. Unrelated record entries remain closed. Browser history and ordinary modified-click navigation retain native expectations. Missing/invalid targets do not navigate to a different story or invent an ID. | U3, U5; E3, E4, E5, E6 | C6; V6: each supplied story destination, direct load, repeated activation and history reaches the intended readable target. |\n| R7 Link meaning | A tree link whose resolved URL names the same document plus a nonempty fragment uses an in-page jump icon. Other-page or external links retain the current leave/go-to arrow. Folding a branch is a different action from following the link. A hash on another page is never treated as same-page. | U4; E1, E5 | C7; V7: fragment-only, same-document relative/absolute, other-page fragment and external controls retain destinations and distinct icons. |\n| R8 Initial tree folding | An unformatted leading `folded:` marker starts a branch of E5 folded. It precedes any tone; an optional native checklist prefix comes before it. Unmarked branches keep the existing open default. A marker on a leaf or inside inline code remains literal text; Unicode chevrons are not consumed as state. | U4; E5, E6 | C8; V8: real parsed marked/unmarked branches and tone/checklist/link combinations have the declared initial state and intact labels. |\n| R9 Author control | E1 can be composed with documented Demistify markup, native HTML and inert content carriers. No page-specific CSS or executable interaction script is needed. Supplied text, order, IDs, links, initial states, grouping and rich showpieces retain their meaning. The renderer neither reads Router nor decides story significance. | U5; E1–E6 | C9; V9: composed source contains no prototype presentation/interaction code, and content/identity readback matches the supplied story/entry set carried onto that page. The private comparison uses the frozen approved source identified in Requirements; any public check first fixes a separately sanitized representative story/entry set and never publishes the private records. |\n| R10 Existing readers | The added page presentation does not change unrelated cards, traces, navigation, Comments, inspection or bottom-workspace defaults. Keyboard navigation and text selection remain usable. Controls have accessible names, visible focus, and layouts remain readable in affected themes and reduced motion. | U2, U3, U5; E1, E5, E6 | C10; V10: controls outside the new composition preserve current documented behavior; changed reader flow meets repository accessibility/responsive checks. |\n| R11 Author guidance | The matching component guide teaches the complete story/section/Map composition and concrete tree marker, defaults, child content and limits. A capable agent can compose it without reading the private approved page source. Unsupported or malformed public syntax is diagnosed by the existing authoring checker rather than taught as supported. | U5, U6; E1–E6 | C11; V11: guide examples are complete and match released metadata/renderer/checker contracts; a composition from the guide has no private script or hidden source dependency. |\n| R12 Verified use | A page composed only from the matching released parts retains the corrected frozen reference's hierarchy, states and navigation outcomes at 1280 and 420. Shared components also remain readable at 390 and in affected themes. | U6; E1–E6 | C12; V12: actual released-only composition and interaction results agree with the corrected frozen reference. Source merge, checker success and hosted fetch alone do not satisfy it. The independent review and owner-showing order remains the delivery gate defined by U6. |\n\n## Boundaries and examples\n\nExisting default tree behavior remains valid: `- risk: [Registry](#story_registry)` names a visible status and a separate navigation action. The new explicit marker is `- folded: risk: [Registry](#story_registry)` with indented children. A checklist form is `- [ ] folded: Branch` with children. Only the plain first-text prefix is metadata; backticked `folded:` stays content. A leading `>` retains its Markdown blockquote meaning, and `▸`/`›` remain literal. This is the target contract, not a claim that the existing released guide implements it.\n\nLocal link identity compares the actual document URL rather than the text's appearance: `other.html#story_registry` remains another page. Malformed URL/fragments and unknown IDs preserve the document and report the real issue through existing diagnostics; no fallback story is selected. Repeated action on the current valid fragment still reveals its story.\n\nEach supplied E4 body occurs once. A repeated reference points to its one anchor instead of copying the body and duplicating IDs. A story can carry more than one reference without the renderer claiming that every referenced row proves every sentence.\n\nNo newly persisted data, network endpoint, external service or permission is required for the renderer. The authoring trust policy for sensitive content continues to apply. Private source records and the frozen page are not published as a consequence of releasing generic components.\n\nProgram Design must settle the exact new markup and owner/call/state contracts without changing R1–R12, including R8's public marker. Verification Design chooses the observations that can decide V1–V12; the supplied PNGs establish appearance reference only, and do not certify runtime behavior.\n","reference":"./specification.md"}</script></ex-markdown>
    <ex-markdown id="program-design" label="Program Design"><script type="application/json" data-ex-markdown-source="">{"text":"# Shared presentation over native story content\n\nThe author writes the story, its entries and the Map. Shared views arrange that content; native `details.open` remains the disclosure truth. Map uses the same sidebar session as Comments. There is no second story model, record reader or sidebar manager.\n\nThis realizes [R1–R12](specification.md#contract-and-proof-obligations) within [U1–U6](requirements.md#who-needs-this). The screen target is the corrected frozen page named in Requirements: compact story text, quiet content surfaces, category headers and the right Map. Its supplied desktop and narrow PNGs are the UI views; they describe the selected appearance, not the new runtime. Private record content stays private.\n\n## Where each entity lives\n\nAll runtime homes are in `packages/demistify`; authored examples live in `apps/demistify-poc`. DOM input follows this package's custom-element vocabulary, native HTML and typed DOM guards. It does not acquire a parallel JSON schema. Interfaces use readonly fields and closed outcome unions. The root's explicit instruction to follow this codebase's conventions governs names, relative imports and existing check locations.\n\n| E | Semantic owner | Home / code name | Schema or shape home | Boundary shape | Disposition / storage | Convention |\n| --- | --- | --- | --- | --- | --- | --- |\n| E1 Page | Page author; document runtime owns reader effects | Existing `DocumentIsland`, modified shared reader controls | Existing vocabulary and review-document capture | `ex-document[id]`, native content; zero or one `ex-map[for]` | Authored HTML file; existing filesystem, no new engine or migration; runtime DOM derived | Existing HTML vocabulary and typed DOM |\n| E2 Section | Section view owns presentation and membership counts; Map reads the same membership | New `SectionIsland` and shared section-membership read | Vocabulary declares `ex-section`; native descendants supply membership | `id`, `title`, optional `icon`, `tone`, `series`; descendant `ex-story`, optional direct `details[slot=smaller]` | Authored DOM, header split and Map total derived; no runtime storage | Existing head/tone/category conventions |\n| E3 Story | Story view owns presentation; author owns every claim | New `StoryIsland` | Vocabulary declares `ex-story` and its named children | Optional `subject`, `time`, `icon`, `tone`; exactly one direct native `details[id]` with `summary` and rich named body children | Authored DOM; native `open` is live state, no copied boolean | Preserve live nodes and original review source |\n| E4 Record entry | Page author; native disclosure owns open state | Existing native `details[id]` inside the story record list | Native HTML; story child contract in vocabulary | `details[id] > summary` and arbitrary supported body content; repeated references use `a[href]` | Authored HTML once per ID; no runtime store | Native HTML and existing issue reporting |\n| E5 Map | Map view owns its content/trigger and derived section totals; shared sidebar owns session | New `MapIsland`; existing `openDrawer` modified with an internal presentation kind | Vocabulary declares `ex-map`; existing tree source and drawer types | `ex-map[for=rootId]` contains exactly one `ex-tree`; each section branch links its section ID; internal live nodes move into a sidebar session | Authored tree; counts derived from section membership, branch DOM state; active session transient, no persistence | Existing take/restore and identity-guarded close |\n| E6 Disclosure | Native `HTMLDetailsElement`; shared scope derives bulk action | New disclosure-scope helper, consumed by section and fold-toggle views | Native `open`; internal `DisclosureAction` union | Members are story root, direct More, record list, each direct entry, and section smaller fold | Live DOM only; membership/action derived, no synchronized store | Typed DOM, native toggle events |\n\n```mermaid\nflowchart TD\n  S[Section] --> B[Control]\n  B --> N[Folds]\n  T[Story] --> N\n```\n\n```mermaid\nflowchart LR\n  M[Map] --> D[Sidebar]\n  C[Comments] --> D\n  I[Inspect] --> D\n```\n\nThe author supplies content to all three views. Section controls request changes to native folds; Map requests a session from the existing sidebar. The sidebar also serves Comments and inspection. The shared reader control row contains their existing buttons plus Map; none of these views owns Comments data.\n\n## What an author writes\n\nThis is the target public markup; the matching released guide and vocabulary must implement the same shape. HTML remains responsible for page layout.\n\n```html\n\u003cex-document id=\"work\">\n  \u003ch2>What it means for you \u003cex-fold-toggle for=\"work\">\u003c/ex-fold-toggle>\u003c/h2>\n  \u003cex-section id=\"done-next\" title=\"What's done / what's next\" icon=\"clock\" series=\"2\">\n    \u003cex-story subject=\"Renderer\" time=\"Fri 08:31\" icon=\"package\" tone=\"done\">\n      \u003cdetails id=\"story-renderer\" open>\n        \u003csummary>The renderer is ready for review\u003c/summary>\n        \u003cp slot=\"headline\">The shared rendering path now preserves the supplied content.\u003c/p>\n        \u003cdiv slot=\"happened\">The author supplies this account.\u003c/div>\n        \u003cdiv slot=\"for-you\">Review the resulting page.\u003c/div>\n        \u003cdiv slot=\"next\">An independent check follows.\u003c/div>\n        \u003cdiv slot=\"showpiece\">\u003ctable>\u003c!-- authored comparison -->\u003c/table>\u003c/div>\n        \u003cdetails slot=\"more\">\u003csummary>More\u003c/summary>\u003cp>Optional depth.\u003c/p>\u003c/details>\n        \u003cdetails slot=\"record\">\n          \u003csummary>The record: 1 entry\u003c/summary>\n          \u003cdetails id=\"entry-renderer\">\u003csummary>Recorded check\u003c/summary>\u003cp>Full supplied text.\u003c/p>\u003c/details>\n        \u003c/details>\n      \u003c/details>\n    \u003c/ex-story>\n    \u003cdetails slot=\"smaller\">\u003csummary>1 smaller\u003c/summary>\u003c!-- routine ex-story members -->\u003c/details>\n  \u003c/ex-section>\n  \u003cex-map for=\"work\">\n    \u003cex-tree>\u003cscript type=\"text/markdown\">\n- [Needs you](#for-you)\n  - [Renderer review](#story-renderer)\n- folded: Where the work is\n  - done: [Renderer](#story-renderer)\n- [What's done / what's next](#done-next)\n  - [Renderer is ready](#story-renderer)\n    \u003c/script>\u003c/ex-tree>\n  \u003c/ex-map>\n\u003c/ex-document>\n```\n\nThe complete example supplies four sections (including `id=\"for-you\"`) and both authored decision columns using existing `ex-grid`. The shortened example shows the done/next section only; its Map's Needs-you branch refers to the complete example's For-you section. No example creates a summary, importance classification or entry text from another source.\n\nThe story root's native `open` attribute is explicit. Complete guide examples open stories and close More, record lists, entries and smaller folds. A carried closed story omits `open`; the renderer never overwrites it. Empty optional slots produce no panel. The three labelled rows, headline and record list are required once; showpiece and More are each at most one. The record summary carries the author's supplied entry count; the library does not infer what a link proves. Duplicate bodies/IDs are invalid. The renderer preserves every supported node rather than rebuilding content from `textContent` or serializing `innerHTML`.\n\nMetadata on the story renders beside its summary, wrapping at narrow widths. Native summaries retain their authored inline content. The labelled rows get clock / user / circle-dashed icons and the visible labels Happened / For you / Next. Story and entry disclosure chevrons remain separate from those labels. The curated subject icon reader handles authored icons; fixed interface icons use the existing Phosphor factory. The bulk action uses the owner's exact pair: `caret-circle-double-down` expands and `caret-circle-double-up` collapses. Those two names and `arrow-bend-down-right` must be included in the existing `shippedIconNames` packaging subset, which produces the released font and CSS; their presence in the installed full icon font alone is insufficient.\n\n## The parts and their contracts\n\n| Owner | Consumers and reason to change | Interface and effect | Failure / lifetime |\n| --- | --- | --- | --- |\n| Story view | Authors need R1's repeatable hierarchy and compact spacing | Enhance one native story disclosure, arrange named children, decorate summaries/rows, preserve identity and `open`; synchronous/idempotent preparation | Structural issues use the existing issue reporter; content stays present. Disconnect releases listeners; reconnect does not wrap again. |\n| Section view | Authors need R3's category header, count and sticky behavior | Existing head factory supplies title/icon/tone. A shared membership read counts all descendant stories whose closest section is this one, separating those inside its one smaller fold. Header reads split counts; Map reads their total. Render one bulk control over this scope. | Invalid/multiple smaller folds are diagnosed, not silently regrouped. Observe child-list changes for counts and disconnect the observer on removal. |\n| Disclosure scope | Page/section controls need R4's exact shared membership | `readDisclosureAction(root)` returns `empty`, `expand` or `collapse`; `applyDisclosureAction(root, action)` sets every current member's native `open` synchronously | Empty scope disables control. No retained action state. Capture native toggle events and scoped content changes to refresh labels; recompute before every action. |\n| Fold-toggle view | Authors place a page control without page script | `ex-fold-toggle[for=id]` renders the same caret-circle-double-down/up button used by section headers; label names its expand/collapse action and scope. Shared icon packaging ships both glyphs. | Missing/ambiguous root is diagnosed and disabled. No fallback to the whole document. |\n| Map view | Authors need R5's one authored tree in the reader controls | Resolve `for`; register one map-trifold button. Open via `openDrawer('Map', take)`; take moves the same live tree into header/body and restore puts it back at its origin | Second Map or invalid root is diagnosed and inactive. Close/disconnect restores content and updates expanded state. Tree branch state survives close and resize. |\n| Sidebar session | Existing Comments, inspection and new Map need one active rail | Internal `DrawerContent.presentation` has closed `standard` and `map` kind variants. Existing callers select standard. Map replaces prior sidebar; an identity-bound close cannot close its replacement | Existing close/focus/resize/restore lifecycle remains authoritative. Bottom `DrawerIsland` stack is independent. |\n| Reader control row | Existing walkthrough/theme/search/Comments and Map need layout without another coordinate patch | An internal registration function owns one live host, stable order, measured row geometry and teardown; registrations return an unregister function | Move original buttons, never clone them. Preserve existing desktop bottom-left and phone top-toolbar placement. Include this host in existing bottom-workspace overlay handling. |\n| Fragment navigation | Document links, Map and walkthrough targets need R6 | Shared same-document URL classification plus existing `resolveTarget` / `revealElement`; Map closes its narrow session before normal fragment navigation | Existing abort controller cancels obsolete async resolutions; invalid or missing target does not select a substitute. |\n| Tree view | Existing trees and Map need R7–R8 | Existing Markdown path parses leading checklist, then plain `folded:`, then tone. Only a branch consumes `folded:`. Same-document links use arrow-bend-down-right, included in the shared packaging subset; others retain arrow-up-right | Inline-code markers and leaf text stay literal; no change to Markdown blockquote parsing. Fold and link remain separate native buttons/anchors. |\n\nThe disclosure set is structural, not all `details` indiscriminately: one direct story root; that root's authored `details[slot=more]` and `details[slot=record]`; each direct entry under that record list; and section `details[slot=smaller]`. The story view exposes a live membership read through its shared DOM helper, so generated body wrappers cannot hide these named children from the scope. A fold inside a showpiece, a nested record quotation, ordinary page notes and Map branches are excluded. Overlapping page/section controls read the same live elements. An author-supplied routine group stays at the end; the checker diagnoses placement rather than moving content to infer significance.\n\nThe section-membership helper is also the only source of Map section totals. Each section branch in the authored tree links to that section's stable ID and omits a count. Its label may differ from the section title: **Needs you is the For-you section's linked branch**, not an additional fifth group; it keeps the label Needs you and links `#for-you`. The approved top-level order remains Needs you, Where the work is, then the other three section branches. Map decorates each section branch with a derived total from the same primary/routine membership that supplies its header; it never parses a number from title text. The checker requires one linked branch per section and diagnoses authored totals on those labels. The Map view refreshes these derived spans after tree readiness and on source-root membership changes, without replacing labels or storing another count. The work-parts group is authored and does not target a section, so it has no section-total decoration.\n\nInternal operation results have closed shapes:\n\n```ts\ntype DisclosureAction =\n  | { readonly kind: 'empty' }\n  | { readonly kind: 'expand'; readonly members: readonly HTMLDetailsElement[] }\n  | { readonly kind: 'collapse'; readonly members: readonly HTMLDetailsElement[] };\n\ntype DocumentLink =\n  | { readonly kind: 'local'; readonly url: URL; readonly reference: string }\n  | { readonly kind: 'other'; readonly url: URL }\n  | { readonly kind: 'invalid'; readonly reason: 'url' | 'fragment' };\n```\n\nThese shapes live with the scope and document-link helpers respectively. A local link has a nonempty decoded fragment and equal origin, pathname and search against the actual document URL. Relative and absolute forms share that decision. The authoring vocabulary remains the one authority for allowed elements, attributes, named child rules and diagnostics; runtime, checker and generated editor metadata consume it.\n\n## How a Map link reaches an open story\n\nThe U3/R5 M shortcut is owned by `MapIsland`, alongside its existing button/toggle. A document key listener is installed only while that valid Map is connected, uses the same protected-input predicate as Comments C, and calls the same `toggle`; disconnect removes it. Its trigger declares `aria-keyshortcuts=\"M\"` and a tooltip. M uses the existing sidebar take/restore/focus edge, including when the live Map trigger is in a standard phone Comments header. No separate shortcut state, dispatch store or sidebar path is introduced. The source audit found no existing M/KeyM command.\n\n```mermaid\nflowchart TD\n  A[Activate narrow Map link] --> B[Close narrow Map]\n  B --> C[Resolve local fragment]\n  C --> D[Reveal story and parents]\n  D --> E[Scroll to target]\n```\n\nThis view shows the narrow case. The first edge is a synchronous Map capture handler, limited to an unmodified primary activation of a valid same-document link in its tree. Narrow is below the shared sidebar's existing 900px breakpoint; closing occurs before the ordinary link effect. At 900px and above the sidebar remains open and navigation starts at resolution. This reuses that breakpoint rather than adding the prototype's independent 760px mode.\n\nMap is non-modal at every width. Its session uses the existing shared aside, including below 900px, with a session-specific full-width inset below the toolbar. It creates no backdrop, leaves the toolbar and pointer/scroll interaction available, and does not trap focus. Escape and Close use the shared session close/focus policy. Standard Comments/inspection sessions retain their current narrow modal dialog and backdrop. When Map is present and one of those standard phone sheets is open, the control-row owner temporarily moves the same live Map button into that sheet's header, before Close. This permits Comments→Map directly despite the standard toolbar being inert. Closing/replacing the sheet restores the button to its row; no cloned button or second Map state is created. Map→Comments uses the exposed toolbar. Pages and other toolbar controls remain usable while Map is open; while standard Comments is open their existing modal treatment is unchanged.\n\nThe sidebar owner calls the control-row owner synchronously with `setModalControlHost(header | undefined)` at each presentation transition. Before hiding/removing any old panel or calling its content restore, it calls with `undefined`, which returns the live Map trigger to its row. After showing a standard narrow modal, it calls with that modal's header; showing a Map or a desktop aside calls with `undefined`. Resize adaptation applies the same detach-before-remove, attach-after-show ordering. Opening, closing, replacement and crossing 900px therefore use one edge. Registration while a modal already exists reads the current host; unregister removes that registration only. Whenever no standard narrow modal is open, the trigger is in the row, never inside a detached/restored content header. This host reference is transient placement, not copied Map state.\n\nNative anchors keep their href, modified-click, target/download and browser history behavior. Ordinary document navigation handles differing fragments through its existing hash-change route. Repeating the current fragment explicitly reuses that route, including relative/absolute same-document forms. Direct load and back/forward use the same resolver. No synthetic replacement ID or second history stack is introduced.\n\nFor a target inside the new story composition, shared reveal opens the target if it is itself a native disclosure, then its containing disclosures. For an ordinary existing target, reveal keeps the prior target-versus-parent rule. Unrelated entries are never enumerated for a reveal. Existing tab, layer, board, explorer and diagram preparation behavior stays on the same resolver path; it is not reimplemented in Map.\n\n| Runtime group | Current path and source | Target delta and returned outcome |\n| --- | --- | --- |\n| Story rendering | `EvidenceTraceIsland.connectedCallback` enhances direct native details with shared head/icons; default trace uses larger ordered-step presentation | **Added:** story view enhances a distinct named story composition. **Unchanged:** live nodes, native disclosure state, icons, original review capture. The ordered trace default is not restyled. |\n| Section / bulk | Card head is supplied by `CardIsland.connectedCallback`; prototype privately queries `.cot details.cot-step` and toggles native state | **Added:** section view plus one scope helper and fold-toggle view replace private CSS/selectors/scripts. **Unchanged:** native `open`; counts/actions are reads, never a mirrored boolean. No existing card header becomes sticky. |\n| Map / Comments | `CommentsView.open` → `openDrawer` → singular `DrawerSession` → desktop aside or narrow dialog → restore/return focus | **Added:** Map is another caller of the same owner, selecting a non-modal aside at all widths; standard callers keep their dialog. **Changed:** shared control registration replaces existing fixed coordinates and temporarily rehomes the live Map button into a standard narrow sheet header. **Unchanged:** replace/restore/identity closure and independent bottom workspaces. |\n| Fragment reveal | `installDocumentBehavior` → hash handler → abortable `resolveTarget` → `revealElement` → scroll; click path currently recognizes only raw leading hash and skips the target itself | **Changed:** shared resolved-URL classification includes same-document relative/absolute links; repeated fragment invokes existing resolver. **Added:** narrow Map close before effect and story-local target disclosure opening. **Unchanged:** cancellation, lazy target readiness, native history and unrelated reveal defaults. |\n| Tree conversion | `TreeIsland.render` → existing Markdown renderer → `convertList` → open disclosure plus outbound icon | **Changed:** plain branch marker sets initial collapsed state; URL classification selects jump icon. **Unchanged:** unmarked open default, tone/checklist content, link/disclosure separation and Markdown trust behavior. |\n\nThese are source-backed paths at base `26b316c2`, not observations of the proposed runtime. The reusable components have no production predecessor beyond the private prototype; the prototype's custom UI code is removed from the migrated page once shared composition carries it.\n\n## State, failure and teardown\n\n| State owner | Transition and guard | Invariant / failure handling |\n| --- | --- | --- |\n| Native disclosure | Manual toggle; scoped expand/collapse; target reveal | `open` is authoritative. Mixed membership yields expand; every open yields collapse. Controls recompute before mutation, then refresh from actual DOM. No rollback or remote failure exists. |\n| Sidebar session | Closed → Map or Comments; Map ↔ Comments through replacement; close/Escape/disconnect → closed | At most one active sidebar. Each transition first restores its predecessor. Old close handles cannot affect a new session. Focus returns to a connected visible trigger; on replacement it follows existing shared return-focus policy. |\n| Map narrow presentation | Resize across 900px while open | Same non-modal aside changes geometry; no duplicate tree or reset branch state. Standard sessions retain existing dialog adaptation. Close uses the current session identity. |\n| Tree branch | Initial marked/unmarked state; independent disclosure toggle | State lives in rendered branch attributes. Navigation never implicitly toggles a branch. Reconnect binds once and preserves prepared state. |\n| Pending fragment | Direct load, hash change or same-fragment activation → resolution; later activation → abort previous | Only the newest live resolution scrolls. Existing resolver's bounded preparation wait remains; an unknown target stays unresolved with the actual issue, never another story. |\n| Reader control registration | Connect / disconnect; optional controls appear or disappear; standard narrow sheet opens/closes | One host orders the original controls: walkthrough, theme, search, Comments, Map. The live Map button temporarily moves to a standard narrow sheet header, then returns. Layout reflows instead of arithmetic left offsets. Teardown removes only the caller's registration; no operation destroys another control. |\n\nStructural parsing uses existing issue reporting. A malformed story keeps its supplied content visible rather than synthesizing claims. Duplicate IDs, multiple Map roots, missing targets and unsupported named children fail the authoring checker. Runtime guards do not repair identity or silently choose a root. There are no network retries, compensating writes, migrations, cross-process consistency rules or new credentials in this renderer.\n\nBulk writes and sidebar replacement are synchronous on the browser event loop. Native toggle notifications may coalesce; observers refresh by reading final native state rather than counting events. A pending fragment resolution is abortable. Closing a Map while its tree is rendering restores the same element, so preparation completes once on that element; removal releases view listeners/observers. A same-session viewport change preserves rather than reconstructs content.\n\n## Styling, trust and existing readers\n\nThe shared theme gains `--surface-document-card`, scoped to these new reading surfaces: white in light mode, page mixed with 1% white in dark mode, following the approved reference. It does not replace `--surface-content`; buttons, left lists, code, drawers and existing cards keep their current surface. Section category bands reuse the existing six series colors, head factory, rule and spacing tokens. Sticky top and target scroll clearance use the shared `--ex-document-toolbar-height` token that sizes the toolbar, never a second hardcoded 44px. When no toolbar exists its clearance is zero.\n\nStory summaries and body use the reference's body typography (`--text-md`, weight 500 summary, 600 headline, smaller quiet metadata), not a new font or the ordered trace's larger title. More and record entries use compact native disclosure styling. Table bodies use one page-like surface inside these parts, not alternating navy and neutral strips. Shared table, diagram and local overflow behavior continues to own rich attachments. Long text wraps; action columns reserve space for Comments rather than covering text. Touch gets existing visible comment affordances and usable control targets; no hover-only interaction is introduced.\n\nThe Map session uses existing drawer animation and reduced-motion handling. Its narrow presentation fills the usable width below the actual toolbar. Close/Escape and expanded/controlled relationships stay accessible. Default Comments source/fingerprint capture happens before any enhancement, and moving live content never recaptures a different source or clones target IDs.\n\nThe authoring trust boundary stays at existing HTML/Markdown/carrier parsing. Story bodies retain supported rich HTML; they are not instructions to fetch Router or run scripts. No source record is fetched, classified or sent over a new transport. Public examples use sanitized material; final private comparison carries the fixed supplied records without publishing them. Content status/tone remains an authored assertion, never library certification.\n\n## Why this composition\n\nTwo credible approaches fit the rendering need. Extending the ordered trace with story-specific roles would reuse its renderer but couple ordered evidence steps to story summaries, labelled rows and records; every future trace change would carry those branches. Dedicated story and section views cost two small public elements, while reusing native disclosures and the existing icon/head/theme/issue infrastructure. That places story hierarchy changes in one owner and keeps trace defaults intact. The latter is selected. Revisit it if the two renderers acquire the same policy rather than merely similar HTML; extract that repeated policy then, without combining the public meanings.\n\nA separate Map aside would retain the prototype's fewer integration edits, but make mutual exclusion, resize, focus and restore a second sidebar lifecycle. Using the existing sidebar costs an internal presentation kind and shared control layout integration; the library maintainer pays that integration once. The current singular owner is selected. A future requirement for simultaneous Map and Comments would invalidate that choice and require a new owner decision.\n\nNative HTML plus three views and one placement control is enough. There is no schema-driven story engine, collection loader, application framework, persisted open-state store or generic overlay framework. The author pays explicit markup; the gain is understandable rich HTML and independently inspectable content, with no private interaction implementation to maintain.\n\n## How each obligation reaches proof\n\n| U | R | E | Owner | Interface | Shape and home | State | Failure | Proof seam |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| U1, U5 | R1 / C1 hierarchy | E3, E4 | Story view | Named story children | Native story DOM; vocabulary + story view | Supplied content retained | Malformed child issue, no invented claim | Rendered same-content story and source/DOM readback, V1 |\n| U1, U5 | R2 / C2 initial folds | E3, E4, E6 | Native disclosure | Authored `open` | `HTMLDetailsElement` | No default override | Missing required native root diagnosed | First-load and carried-state DOM, V2 |\n| U2 | R3 / C3 sections | E1, E2, E3, E5, E6 | Section view; Map reads its membership | Count/header/Map-total membership | Section DOM; shared section-membership helper, vocabulary | Derived split header and total Map count, sticky geometry | Multiple/misplaced smaller, missing branch or authored total diagnosed | Four sections, columns, split/total counts and scroll geometry, V3 |\n| U2 | R4 / C4 bulk | E2, E6 | Disclosure scope; icon packaging | Read/apply action, shipped pair | `DisclosureAction`; scope helper; existing `shippedIconNames` | Native state, mixed→expand | Empty scope disabled; missing glyph fails released view | Manual/cross-scope action, complete membership and actual double-down/up glyphs, V4 |\n| U3 | R5 / C5 panel | E1, E5 | Sidebar session | Map take/restore | `DrawerContent`; existing drawer types | One current session | Identity-guarded close/restore | Map↔Comments, keyboard/resize and geometry, V5 |\n| U3, U5 | R6 / C6 destinations | E3, E4, E5, E6 | Fragment navigation | Resolve/reveal current fragment | `DocumentLink`; document-link helper | Abort prior request, reveal native folds | Invalid/missing stays unresolved | Each stable destination, history/repeat/direct load, V6 |\n| U4 | R7 / C7 link icon | E1, E5 | Tree view; icon packaging | Shared URL classification, shipped jump glyph | `DocumentLink`; document-link helper; existing `shippedIconNames` | Stateless icon choice | Invalid URL issue; missing glyph fails released view | Actual parsed links, preserved href and visible packaged jump/outbound icons, V7 |\n| U4 | R8 / C8 branch marker | E5, E6 | Tree view | Plain-prefix parse | Existing Markdown DOM; tree conversion | Marked closed, unmarked open | Leaf/code marker literal | Real parsed marker/tone/checklist/link combinations, V8 |\n| U5 | R9 / C9 author control | E1–E6 | Page author + vocabulary guard | HTML composition | Authored source; existing review capture | Identity and form retained | Duplicate identity/unsupported syntax diagnosed | Script/style absence plus fixed supplied-set readback, V9 |\n| U2, U3, U5 | R10 / C10 existing readers | E1, E5, E6 | Shared reader integration | Control registration/sidebar/fragment routes | Live controls and existing session types | Original state owners retained | Teardown/abort, no clone or global restyle | Existing trace/cards/Comments/bottom workspaces plus changed flow, V10 |\n| U5, U6 | R11 / C11 guidance | E1–E6 | Vocabulary and component guide | Matching source examples | Existing generated metadata plus packaged skill references | Matching binding | Unsupported syntax diagnosed | Guide-only complete author composition and checker, V11 |\n| U6 | R12 / C12 verified use | E1–E6 | Published library composition | Matching runtime/theme/guide | Released artifacts over authored HTML | Same defined states | Missing asset or mismatch fails the observation | Independent evaluation of released-only private page, V12 |\n\nAll R1–R12 are structurally covered by these rows; V1–V12 name observation seams, not passing observations. E1–E6 are covered by the binding rows; U1–U6 trace through the table. Defaults, marker combinations, both decision columns, ordinary-note exclusion, repeated fragments, modified clicks, narrow resize and light/dark/reduced-motion constraints are covered by the named interface/state/style sections. None is superseded.\n\nMaterial invalid states are rejected at trusted entries: malformed story/Map composition and duplicate IDs by vocabulary/checker/runtime guards; impossible simultaneous sidebars by the existing singular session owner; stale close by identity guard; stale fragment scroll by abort guard. The `DisclosureAction` union excludes an empty action carrying members. Native DOM remains externally mutable, so scope controls always re-read it rather than claiming type-level impossibility.\n\nThe DOM, parser, sidebar and navigation are in-process dependencies and must be real for interaction proof. Controlled sanitized content may replace private prose in public tests, but cannot establish private record fidelity. Hosted asset delivery is a true external boundary and must be observed separately after release. An injected or copied prototype cannot prove R12. No proof seam needs a new production flag or second rendering path.\n","reference":"./program-design.md"}</script></ex-markdown>
    <ex-markdown id="verification-design" label="Verification Design"><script type="application/json" data-ex-markdown-source="">{"text":"# Prove the shared page through its real reader\n\nThe decisive result is a page composed from the released library and guide that keeps the approved story hierarchy, native folds and Map behavior. Local source checks and browser tests prepare that result; they cannot replace it. This document plans observations. It reports no product run.\n\n## What will show each need is met\n\n### U1: Read a story and its record\n\n**Proven by:** Open the same story in the approved view and shared composition, read the headline and three rows, then open More and each supporting entry without losing the story or rich attachment.\n\n**Outside this observation:** Historical claims in supplied text are not certified.\n\n### U2: Scan and expand four sections\n\n**Proven by:** Scroll each section under the toolbar, check its primary/routine count against Map, and expand/collapse from both page and section controls after manual changes.\n\n**Outside this observation:** Unrelated custom page layouts are not generalised from this composition.\n\n### U3: Reach stories with Map and Comments\n\n**Proven by:** Switch both ways between Map and Comments, then follow every story link including one already in the URL; each target opens in view while unrelated records stay closed.\n\n**Outside this observation:** Desktop emulation is not physical iPhone/Safari proof.\n\n### U4: Understand links and folded branches\n\n**Proven by:** Read actual rendered in-page/outbound icons and operate marked/unmarked tree branches independently of their links.\n\n**Outside this observation:** Unlisted Markdown syntaxes are not implied supported.\n\n### U5: Author with shared parts\n\n**Proven by:** Compose a complete example from the matching guide, compare its source and rendered content with the fixed supplied set, and check that it needs no private CSS or interaction scripts.\n\n**Outside this observation:** A sanitized public example cannot prove private record fidelity.\n\n### U6: Use it after independent checks\n\n**Proven by:** After independent implementation review and release, Terra reads and operates the released-only private composition against the corrected reference at the required widths.\n\n**Outside this observation:** No merge, source version or HTTP acknowledgement alone is acceptance.\n\nReferences and semantics come from [Requirements](requirements.md) and [R1–R12 / V1–V12](specification.md#contract-and-proof-obligations). Owners and real observation seams are in the [Program Design trace](program-design.md#how-each-obligation-reaches-proof).\n\n## Shared observations\n\nThe 7 November U3/R5 shortcut addition is observed in O3/O5 on the same real built reader: press M to open and close Map, use C then M to replace the shared panels in both directions at desktop and narrow widths, and inspect the actual trigger relationship/focus. Editable fields, composing/repeated/prevented events and Meta/Ctrl/Alt combinations must not toggle Map; uppercase M follows C's existing case-insensitive policy. A removed or invalid Map leaves no listener action. The permanent browser case drives native keys for reader actions; labelled integration events may inspect repeat/composition/default-prevention rejection, which are not relabelled hardware input. Reuse unchanged earlier reader proof and refresh this new shortcut path on the final target. These observations extend the existing U3/R5 row; no private preservation or release claim follows.\n\n**O1 — complete controlled composition, lasting journey needed.** A sanitized fixed input contains four sections, primary and routine stories, the two decision columns, all three labelled rows, one example of each supported showpiece form, More, records with stable entry IDs and a zero-entry record. Each optional form has an absent control. At least one story is explicitly carried closed; normal new examples are open. More, record lists, entries and smaller groups start closed. Ordinary page-note details and a nested attachment disclosure are outside bulk membership. The Map has Needs you linked to For-you, authored work-parts, then three other section branches; section totals are un-authored and derived. The real built runtime/theme and font are loaded, not source-module substitutes.\n\nThe input manifest is fixed before observation from authored HTML and reviewed expected content, not read back from renderer-generated metadata. Read source and rendered text, inline markup, links, order, IDs, supplied state, table cells, actual SVG labels and entry bodies. Every full body appears once. The public checker accepts the complete composition and rejects missing/duplicate required slots, duplicate IDs, unresolved targets, more than one showpiece/Map, misplaced smaller groups, missing section branches and stale authored Map totals. Preserve rendered content and actual diagnoses for malformed inputs. A checker's exit proves its named authoring rules only.\n\n**O2 — native disclosure scope, lasting journey needed.** On O1's page, inspect initial state, manually open one record entry, then use section expand, page collapse, manual story open, page expand, section collapse and the other section's control. Record each listed member's actual `open`, each control's visible glyph and accessible action, and excluded notes/attachment state. With Map closed and its tree restored at its origin, also record every Map branch's `aria-expanded` and `data-collapsed` after each action; bulk controls must leave those states unchanged. Expansion must reach each individual entry, not merely its closed parent; collapse must close every member in scope. Split header and Map total agree with explicit membership, including empty/routine-only cases and a live member addition/removal. Mutating input for the count boundary is a component integration case; native click/keyboard drives the actual controls. Use no mock disclosure state or remembered control boolean.\n\n**O3 — Map and fragment navigation, lasting journey needed.** Drive the real Map trigger with pointer and keyboard. On desktop and narrow layouts switch Map→Comments using Comments, then Comments→Map using the live Map trigger in the standard narrow sheet header. Check that exactly one sidebar is present, the same tree/trigger nodes survive, branch state stays intact, focus is returned to the appropriate connected trigger and the button returns to its row after Close or resize. Resize while each presentation is open across 899/900; exercise Escape and Close. While Map is open the toolbar/Pages controls are usable, the panel begins below its actual lower edge, no backdrop covers it and focus is not trapped. Standard Comments/inspection keeps its established modal narrow behavior; bottom workspaces still coexist independently.\n\nFollow each story destination, including one inside the smaller fold. Before activation, close the story and its containing group while keeping unrelated entries closed. The narrow Map must close before the revealed story is scrolled into view. Repeat the already-current fragment, load it cold, and use native back/forward. Exercise `#id`, same-page relative and absolute forms, another-page fragment, external URL, encoded fragment, malformed and missing targets, modified clicks and `target`/`download`. The intended target and ancestors open; another story is never substituted. A rapid second local destination must win over an earlier pending target resolution. Compare URL/history and actual visible destination, not URL alone.\n\nAt desktop and narrow width, run with normal motion and real browser-emulated reduced motion. Read actual Map and Comments panel animation/transition names and durations: the shared family applies normally; reduced motion removes or makes the transition instant. Screenshot appearance alone cannot establish this. Authored malformed or missing link targets are decided by the existing checker diagnostics in O1; runtime activation or cold load of a missing/malformed fragment must preserve the document and substitute no story, with no new runtime diagnostic expected. Absolute same-document links use the actual fixture URL as a labelled input setup, then native activation.\n\n**O4 — tree parsing and shipped icons.** Focused parser/URL classification checks decide plain prefix and URL identity; real tree DOM plus the built packaged font decides its visible controls. Include marked/unmarked nested branches, checklist before marker, tone after marker, link labels, inline-code marker, literal leaf marker, loose paragraphs and Unicode chevrons; a leading `>` still parses as blockquote. All expected label content survives. Fold controls change only their branches; links retain href. Read packaged CSS/font subset membership and actual painted icon glyphs for `arrow-bend-down-right`, `arrow-up-right`, `caret-circle-double-down` and `caret-circle-double-up`; a class name without a glyph is a failure. New marker/default checks join the permanent component browser case, not a one-off automation driver.\n\n**O5 — layout and unchanged readers.** Inspect O1 at 1280 and 420, plus the repository's 390 CSS-pixel width, light/dark and reduced motion. Compare the supplied reference pictures and authored CSS/HTML intent to the new screenshots: compact row hierarchy, quiet neutral section content, existing category header band, wrap, one local table surface, original button colours, sticky headers, reserved comment controls, usable target sizes and complete rich content. Page overflow or hidden clipped content fails; a deliberate rich-view local scroller must reach every endpoint. Exercise the changed interactions at desktop and narrow width in each affected theme. Reuse applicable unchanged real-path assertions; add no duplicate manual journey solely to repeat them. New shared-control placement must be hit-testable with Map absent/present and with a bottom workspace open. Theme/search/walkthrough/Comments controls remain reachable after open/close/resize; existing trace and card defaults retain their prior typography and surfaces.\n\nBefore product edits, capture the existing `review-ui/content-spacing.html` fixture's `#spacing-trace`, `#composition-step > summary` and `#trace-owner` against the complete base `26b316c` build, in both themes at desktop/390. Keep screenshots and computed background, font family/size/weight/line-height, spacing and control colours from that frozen baseline; compare the same native fixture/targets on the candidate. A global surface-token or Trace typography change must fail even if the new story looks correct. This is a baseline observation, not a fixture rebuilt from the new renderer's expected styles. Also use native pointer text selection across story body rows and summary text and read the selected text plus unchanged fold state; use keyboard Tab to each fold toggle, Map trigger and story summary, and inspect visible focus and accessible name. Internal Selection setters and scripted `.focus()` alone do not prove these outcomes.\n\n**O7 — independent guide-only composition, temporary journey.** A fresh Luna author receives only the matching local candidate guide (all packaged references), the fixed sanitized story/entry input set and the required output path/binding. It receives no prototype, private reference, design documents, implementation diff or prior conversation. Record the exact allowed inputs and preserve its first submitted composition before any feedback. Judge that first artifact against O1's input and R11: supported syntax, complete grouping/fields/links/states, no private CSS or executable interaction, and a real static check plus rendered interaction. A guide missing a required rule must cause a failing result rather than being repaired privately by an informed author. If it fails, improve the guide and use another fresh first-composition trial; retain the failure. This bounded case establishes that the guide can carry this task, not a general author-capability score.\n\n**O6 — released-only private composition, temporary journey.** After source review, required checks and independent implementation review, prepare the library's normal release artifacts and matching guide through its existing release workflow. Observe the actual hosted runtime, stylesheet, font, lazy chunks and guide from that release. The private page uses only those matching released resources; no local source import, source-worktree asset, private style/script or prototype fallback is permitted. Fix the supplied private story/entry input set from the frozen reference before migration and compare its exact texts, rich forms, IDs, links, group/order and states to the resulting source/readback. A carried field cannot silently disappear because the new interface lacks a slot.\n\nThe independent Terra evaluator then compares the page with the corrected reference, operates O2/O3, and reads representative rich content at 1280/420. This is an outcome check, not an assertion that every historical claim is true. The full entry input/readback comparison establishes preservation; sampling alone cannot establish it. The owner receives the usable page only after this result and the library review. Source/code review, local fixture success, release preparation, publication and hosted reader success remain separate evidence classes.\n\n## Requirement coverage\n\n### U1; R1, R2, R9\n\n**Proven by / seam:** O1 rich source→DOM, O5 screenshots, O6 private readback\n\n**Reference:** Corrected frozen reference; supplied content/state; C1/C2/C9\n\n**Target and journey / lifetime:** Built library in plain-HTML PoC, O1/O5 needed lasting journey; released private page O6 temporary\n\n**Passes when; wrong build rejected:** Exact hierarchy, supplied meaning and native states survive at required widths; flattening rich text, auto-opening records, losing a field or duplicating an ID fails\n\n**Reuses:** Existing source/Markdown/inspection real-path coverage applies only to unchanged attachments, not new story markup\n\n**Unverified:** Historical truth; other engines/devices; private fidelity pending O6\n\n### U2; R3, R4, R10\n\n**Proven by / seam:** O2 native membership/actions, O5 header/control geometry\n\n**Reference:** C3/C4/C10; frozen header/toggle design and owner's exact pair\n\n**Target and journey / lifetime:** Built O1 composition, O2/O5 needed lasting; actual released view O6 temporary\n\n**Passes when; wrong build rejected:** Every listed native fold and only those folds changes; mixed/all-open actions/glyphs agree; split/total counts match; headers/controls never cover text; stale Map total, skipped entry or overlap fails\n\n**Reuses:** `drawer.browser.test.ts` cases “the open workspace keeps desktop reader controls reachable” (1024/1440/1600 hit testing and restored placement) and “a phone call sheet fits its body within the viewport cap” (390, light/dark); these preserve only their named existing paths\n\n**Unverified:** Arbitrary author layouts; required new scope/layout observations pending\n\n### U3; R5, R6, R10\n\n**Proven by / seam:** O3 real sidebar/reveal/history, O5 geometry\n\n**Reference:** C5/C6/C10; corrected Map name; current standard-sheet and bottom-workspace contracts\n\n**Target and journey / lifetime:** Built O1 composition O3/O5 needed lasting; released page O6 temporary; desktop Chromium and native Chrome\n\n**Passes when; wrong build rejected:** Both sidebar switch orders are reachable, only one active, focus/trigger/tree retained, intended story revealed before scroll, repeated/direct/history links work; inert switch, lost button, wrong target or stale scroll fails\n\n**Reuses:** Existing cold-fragment and sidebar replacement cases plus bottom-workspace tests cover their unchanged paths; none already covers Map\n\n**Unverified:** Physical phone/Safari and other browser engines; reference interaction itself unobserved\n\n### U4; R7, R8\n\n**Proven by / seam:** O4 parsed DOM, classification and actual packaged glyphs\n\n**Reference:** C7/C8 literal marker and local-link rules, exact chosen icons\n\n**Target and journey / lifetime:** Owning pure parser/URL code for focused checks; built runtime/tree/font for new permanent browser assertions; no separate journey added\n\n**Passes when; wrong build rejected:** Every syntax/control result matches reference combinations; other-page fragment is outbound, code/leaf marker literal, unmarked open, marked closed; missing glyph or swallowed label fails\n\n**Reuses:** Existing tree-label browser cases retain multiline/inline-code behavior only\n\n**Unverified:** Unspecified Markdown forms; current release does not yet contain the target syntax\n\n### U5; R1, R2, R6, R9, R10, R11\n\n**Proven by / seam:** O1/O3/O5, structural source check, O7 independent guide-only author composition and O6 full readback\n\n**Reference:** Supplied fixed sanitized set, separate fixed private set, C1/C2/C6/C9/C11\n\n**Target and journey / lifetime:** New guide at matching local candidate binding; plain authored HTML and real checker; O1/O3/O5 lasting, O6/O7 temporary\n\n**Passes when; wrong build rejected:** A complete composition can be authored using guide only, checker agrees with metadata/renderer, no private CSS/executable interaction; unsupported syntax, missing field, hidden dependency or altered identity fails\n\n**Reuses:** Existing CLI embed/check owner for unchanged carrier mechanics, not as proof of new syntax\n\n**Unverified:** General agent capability/ease is not established by a single example; historical truth excluded\n\n### U6; R11, R12\n\n**Proven by / seam:** O6 real hosted release and independent comparison, with O1–O5 and O7 evidence\n\n**Reference:** C11/C12 and U6 order; corrected frozen reference\n\n**Target and journey / lifetime:** Matching released runtime/theme/guide/font/chunks, actual private page at 1280/420; O6 needed temporary\n\n**Passes when; wrong build rejected:** Independent review closes findings, released-only resources are actually loaded, input preservation and visible states/navigation match; local fallback, blank icon/chunk, copied prototype or fetch-only success fails\n\n**Reuses:** Existing release staging/HTTP checker supports artifact identity only; cannot replace the reader result\n\n**Unverified:** Release credentials/workflow access not preflighted; required final runtime proof remains pending\n\nEach row names all obligations assigned to its U; a shared observation is defined once above. These planned rows claim no pass. A materially different allowed implementation that preserves native content/state and the same visible outcome passes; assertions do not require private class names, exact SVG paths or a particular wrapper tree.\n\n## Evidence already available for reuse\n\nThe existing `verify-demistify` skill and its journey source map cover frozen built-library launch, Markdown/source, fragments, tree labels, inspection and Comments. Its current browser harness snapshots real dist assets and consumer output into fresh same-origin frames. `openFixture` waits for upgraded navigation, stylesheet and fonts; individual cases wait for their actual rendered outcome. A listening port or `prepared` attribute alone is not its readiness proof.\n\nThe source-read cold-fragment case in `document.browser.test.ts` reaches `#notes--recovery` and `#plan-diagram` through the full built runtime before any click. The sidebar replacement case drives two real inspection controls and checks the retained content, target position and returned focus. Those establish regression expectations for existing paths, not Map coverage. `drawer.browser.test.ts` drives real bottom workspaces, native Escape, phone body containment, and desktop theme/Comments/search hit testing, including restored controls and live walkthrough/diagnostic overlays. These are applicable R10 regressions because the control host changes. Reuse their actual current-target results, rather than carrying historical counts forward.\n\nNo existing lasting journey names the new story/section/Map surface. O1/O2/O3/O5 are needed extensions in the project's permanent harness and `verify-demistify` recipe. Product tests remain the implementation's responsibility; the paired Verifier maintains the declared journey/observation recipe. This plan introduces no separate Playwright driver, application test mode or mocked production state. Browser automation already inside the repository harness is distinct from the requested direct Chrome evaluation.\n\n## Reference limits stay explicit\n\n- **G1:** available reference pictures are dark 1400/400, not exact 1280/420/390 or light. Their hierarchy and styling, plus frozen authored layout, are the appearance reference; no exact-pixel comparison at absent sizes is claimed. Candidate views at every required size/theme still must be inspected. Light follows shared theme semantics while retaining the same hierarchy.\n- **G2:** the corrected Map header, new jump icon and folded-marker syntax have no old screenshot. Their explicit C5/C7/C8 contracts are the reference, not invented golden pixels.\n- **G3:** frozen prototype interaction is source-known; executing its file URL was denied. Do not retry that action through another surface, agent, proxy or copied HTTP target. The candidate's real interactions must satisfy the explicit contract; prototype execution is not required as their oracle.\n- **G4:** the reviewer's access to some owner-authority pushes is attributed. The Lead has opened the actual commission/correction messages, and Requirements fixes those authorities. This does not reduce required runtime coverage.\n\nThese limits waive no candidate observation. A required observation that cannot run remains incomplete and returns its exact blocker; it does not become a source-only pass. The intended native Chromium/Chrome targets do not claim physical touch hardware or Safari support from CSS-width emulation. No account/backend is needed for the public-safe composition. Release access and actual final Chrome interaction feasibility must be checked before their dependent work is declared ready.\n","reference":"./verification-design.md"}</script></ex-markdown>
    <ex-markdown id="implementation-plan" label="Implementation plan"><script type="application/json" data-ex-markdown-source="">{"text":"# Deliver the shared story and Map composition, including M\n\n## Governing basis and delivery context\n\n- Plan path: `docs/specs/2026-11-07-show-me-page/plans/2026-11-07-shared-story-map-with-shortcut.md`\n- Originating planner: `plan-update`\n- Supersedes: `docs/specs/2026-11-07-show-me-page/plans/2026-11-07-shared-story-map.md`\n- Planning result: ready\n- Governing planning basis: reviewed-four-document-design; [Requirements](../requirements.md), [Specification](../specification.md), [Program Design](../program-design.md), [Verification Design](../verification-design.md).\n- Current review/remediation identities: `tmp/show-me-page-review/spec-review-1-f10-closure.md`, `program-review-1-correction-2.md`, `four-document-review-1-correction-2.md`. The Lead read the complete reviews, their correction sources and decisive code anchors. The closures admit planning; none is product acceptance.\n- Planned-at branch / HEAD: `feat/demistify-show-me-page`, `94896328b1686f3180eb5bca2ea644a3ca8f8ce1`; isolated worktree `/Users/shravansunder/dev/sunstack-tools.feat-demistify-show-me-page`.\n- Requested terminal: `pr-ready-unmerged` for source implementation. The Lead then carries the separately authorized release and final private evaluation through the existing release workflow; that continuation is not an automatic expansion of the executor's terminal.\n- Delivery grouping: `single:shared-story-map`; PR topology: `one-pr`; repository: `ShravanSunder/sunstack-tools` only. No tracker selected; existing work thread/trail remains the tracking home.\n\nThe owner commissioned getting the approved page deployed and verified before use, quoted in the 7 November commission named by Requirements. That is the authority for the delivery continuation, distinct from available GitHub/CI access. The generic source-push allowance alone does not authorize
