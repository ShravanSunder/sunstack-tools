<h1>Program Design</h1>
<ex-markdown id="program-design" label="Program Design"><script type="application/json" data-ex-markdown-source="">{"text":"# Program Design: filters\n\n4 Nov 2026. Author: 🦁 Lead. Status: draft; renamed from the reviewed owner-assessment draft (`9116442`) to the owner's final vocabulary, plus the inline rule (R8). Answers to [specification.md](specification.md). Base `4aa594a` (engine 0.6.0 plus #128). Current-system map: `tmp/design-workflows/2026-11-04-owner-assessment/current-system.md` (Researcher `codex-local/01a1a544`, 109 anchors; decisive ones reopened by the Lead and cited below).\n\n## How it works\n\n```mermaid\nflowchart LR\n  cfg[\"RulesConfig\u003cbr/>filters · kinds (rule or inline_rule)\"] --> admit[\"admission\u003cbr/>load_checked_rulebook\"]\n  admit --> targets[\"select_targets\u003cbr/>checked files\"]\n  targets --> folders[\"filter folders (new)\u003cbr/>file → folder; reads files added as context\"]\n  folders --> build[\"EvidenceBuild + selection\u003cbr/>over checked ∪ reads files\"]\n  build --> ask[\"filter stage (new)\u003cbr/>one Choice per folder per filter\"]\n  ask --> run[\"rulebook run\u003cbr/>only_when gate before the first step (new)\"]\n  run --> project[\"project_outcome\u003cbr/>filter_answers[] · filter_skips[] · reasons\"]\n```\n\nThe filter stage sits where the map found the only clean boundary: after evidence and selection finish (`lint_run.rs:475`) and before `run_rulebook_with_dispatcher` (`lint_run.rs:561`). It uses the run's existing dispatcher and backend, so budget, cancellation and usage stay one system.\n\n## The choice\n\n| Option | Gains | Costs | Verdict |\n| --- | --- | --- | --- |\n| **A. A filter stage plus a gate before a rule's first step** | one question per folder; mechanical and asking rules both gated; unsure and failed answers reported, never passes | a new config section, one new stage, a reason on `not_applicable`, report fields | **selected** |\n| B. Extend `select` to choice questions | reuses selection | `select` keeps or drops pieces per file; it can't reach a reference's folder or give several rules one answer (map Q3, Q6) | rejected |\n| C. The caller answers first and injects results | no engine change | a workaround the owner forbids; answers outside the run's budget, cancellation and report | rejected |\n\nSettled by the owner (decisions 8 and 9, see Requirements): filters use the run's one model through the existing dispatcher and backend (`model_request_dispatch.rs:24–47`), and the existing skill-aware resolver is later work. Reopens: if a second model is needed for one filter, or folders ever need variable depth or nesting.\n\n**Review round 5 (F11–F13), corrected:** the filter question uses the native Choice wire (`instructions` plus `criteria`, `decision_contracts.rs:98–115`); folder metadata travels under `where`; an inline rule's refusal carries its config path.\n\n**Advisor review (4 Nov), accepted:** a filter reads one text field of an unselected kind, through the existing model view, and never asks from the path alone (R9); a gated file in no folder makes the run incomplete; a judged answer keeps every probability and both model identities.\n\n**Lead's calls in this revision, each reversible:** a folder's members are every checked file under it (the earlier `members` globs are dropped: no caller needs a narrower set, and `per` already bounds the folder); a gate names one filter (two would need an and/or rule nobody asked for); an inline rule sits only on a kind's own matcher, not inside field sources (they keep naming a rule or a kind).\n\n## Where each entity lives\n\n| E | Owner | Home | Shape at the boundary | Persisted? |\n| --- | --- | --- | --- | --- |\n| E1 Filter folder | `sunstack-lint` | resolution: `lint_execution/filter_folders.rs` (new) | runtime `FilterFolder { filter: FilterName, folder: RelativePath, display: String, reads: ReadsPiece }`, `ReadsPiece = One(PieceId) \\| None \\| Ambiguous(Vec\u003cPieceId>)`; `per` segments are literal, `*` or the one `{name}` (no `**`) | derived per run |\n| E2 Filter | `sunstack-lint` (config), `sunstack-rules` (admission) | config: `RulesConfig.filters` (modified `configuration_loading/config_contracts.rs`); admitted: `filters/filter_plan.rs` (new) | config `{ \"\u003cname>\": { \"per\": \"\u003cpattern>\", \"reads\": { \"file\": \"\u003cpath in folder>\", \"kind\": \"\u003cevidence kind>\", \"field\": \"\u003cfield>\" }, \"question\": \u003cchoice question, same wire as rule questions>, \"min_probability\": 0.7 } }`; admitted `FilterPlan { name, per: FolderPattern, reads: ReadsSpec, question: AdmittedChoiceQuestion, answers: BTreeSet\u003cAnswerLabel>, min_probability }` | persisted (config) |\n| E3 Filter answer | `sunstack-rules` | `filters/filter_run.rs` (new) | `FilterAnswer { filter, folder, input_cut: bool, requested_model, resolved_model: Option\u003cModelName>, state: Judged { answer, probability, probabilities } \\| Unsure { answer, probability, probabilities } \\| Incomplete { reason: FilterIncomplete } }`; `FilterIncomplete = Undescribed \\| Ambiguous \\| ReadsAbsent \\| ReadsUnavailable(UnavailableReason) \\| ReadsTooLarge \\| Request(IncompleteReason)`; `resolved_model` comes from the response's `ExecutionReceipt` (`decision_contracts.rs:124`) | derived per run |\n| E4 Gate | `sunstack-rules` | `rulebook_planning/rulebook_entry_wire.rs` (modified: optional `only_when`); `RulebookRule.gate: Option\u003cOnlyWhenGate>` | wire `{ \"\u003cfilter>\": [\"\u003canswer>\", …] }` (one key); admitted `OnlyWhenGate { filter, answers: BTreeSet\u003cAnswerLabel> }` | persisted (rulebook) |\n| E5 Filter skip | `sunstack-rules` (records), `sunstack-lint` (report) | `RulebookRun.skips` (modified `rulebook_run.rs`); report `filter_skips` (modified `lint_reporting/report_contracts.rs`) | `FilterSkip { rule, file, filter, folder: Option\u003cRelativePath>, why: Unsure \\| Incomplete \\| NoFolder, probabilities: Option\u003c…> }` | derived per run |\n| E6 Evidence kind's rule | `sunstack-evidence` | `evidence_planning/evidence_kind_contracts.rs` (modified), `evidence_project_loading.rs` (modified) | wire: exactly one of `\"rule\": \"\u003cid>\"` or `\"inline_rule\": \"\u003cone-line YAML>\"`; runtime `KindMatcher = Named(EvidenceRuleId) \\| Inline { text: String }`, both resolving to one `EvidenceRuleId` in the project (`Inline` uses the kind's name) | persisted (config) |\n\n`NotApplicable` gains a reason (modified `decision_walking.rs:29–114`): `NotApplicableReason = Route \\| Filter { filter, answer, probability }`. Every existing route sets `Route`. `basis()` (`decision_walking.rs:102–114`) gains one case: a `Filter` reason is judged; every other result keeps today's calculation from its read answers, so an ungated choice step that routes to `not_applicable` stays judged.\n\n## Interfaces\n\n- **Admission.** `admit_rule_entry` gains the admitted filter registry as an input (`rulebook_admission.rs:29`), so a gate's filter and answers are checked with the entry's other refusals; R6's refusals are `AdmissionRefusal { field_path, message }` like today's. Filter admission runs in `load_checked_rulebook` (`config_validation.rs:23–105`) before rulebook assembly. The strict decoder's safe-field list gains `filters`, `per`, `reads`, `only_when`, `inline_rule` (`strict_decoding.rs:60–188`).\n- **Inline rules.** `EvidenceKindDefinition.rule` becomes `matcher: KindMatcher`, decoded through a closed wire struct that refuses both or neither key, as `field_source_decoding.rs` already does for `rule`/`kind`. `load_evidence_project` (`evidence_project_loading.rs:210–325`) gains the inline rules as an input: each string is decoded with the same `SerializableRuleConfig` path the rule files use, given the kind's name as `id` (a string that declares its own `id` is refused), checked against reserved utilities and languages, and registered exactly as a file rule is: `rule_ids.insert` (whose duplicate refusal, `evidence_project_loading.rs:304–308`, catches a rule file reusing the kind's name), `rule_languages`, then the shared `RuleCollection`. Each inline input carries its origin, `InlineRule { kind, text, origin: ConfigPath }` (`evidence.kinds.\u003cname>.inline_rule`), and `ProjectRefusal` gains `origin: Option\u003cConfigPath>`; `load_checked_rulebook` maps an origin-bearing refusal through the existing `config_error` path (`config_decoding.rs:209–242`) so the report names the owning JSON key, while a named rule file's refusal keeps its file, line and column (`config_validation.rs:28–35`). When any inline rule exists, the rules config file joins `EvidenceProject.inputs`, because its bytes now decide matching.\n- **Model activation.** `model_work` (`lint_run.rs:128–158`) also counts any admitted gated rule, so a rulebook of only mechanical gated rules prepares the backend and refuses a missing key before acquisition; `--check` stays keyless and evidence listing asks nothing.\n- **Folders, in two phases.** Before the build, `resolve_filter_folders(config, checked_files, repo_root) -> FilterFolderPlan` matches each checked file's folder prefix against each `per` (fixed depth, so at most one folder per filter) and lists each demanded folder's `reads` file (`folder/reads.file`) as a context input, read through the same checked source and limits. After the build, `bind_reads_pieces(plan, pieces) -> FilterFolders` binds the one piece of `reads.kind` in that file: none → `Undescribed`, more than one → `Ambiguous`. The filter stage receives `FilterFolders` as its input type from `sunstack-rules`.\n- **Build.** `EvidenceBuild` runs over checked files plus context files. Context pieces live in a context catalog kept apart from rule-picked pieces: `pick_pieces` never drops them, and the rulebook runner pairs only pieces whose file is checked. The `reads` file is a dependency of its members at both change boundaries, change selection before `select_candidates` (`lint_run.rs:343–394`) and final picking (`evidence_piece_picking.rs:10–75`), so a changed description selects its members, selected kinds included.\n- **Filter stage.** `ask_filters(plans, folders, pieces, dispatcher) -> FilterAnswers` builds one Choice request per (filter, folder) whose folder has a checked member read by a gated rule, with state `{ \"where\": { \"folder\": \u003cpath> }, \"\u003cfield>\": \u003cprojected field value>, \"cut-fields\": [\"\u003cfield>\"] }`, the same shape rule requests use (`decision_walking.rs:125–161`): the field's value as `project_model_view` returned it (`evidence_model_view.rs:74`, with the `reads` kind's `max_chars`), including its inline `[cut]` text, and `cut-fields` from that view's `cut` list, omitted when empty as for rule pieces. `input_cut` is derived from the same `cut` list, never by searching the text. Before building it: `FieldValue::Absent` → `ReadsAbsent`, `Unavailable` → `ReadsUnavailable`, each with no request. The encoded request then goes through the shared dispatcher, whose existing size check measures the whole question, state and model body against `request_max_chars` before any HTTP call (`model_request_dispatch.rs:99–107`); its refusal becomes `ReadsTooLarge`, so there is no second size checker. The state puts the folder under the reserved `where` key exactly as rule requests carry their place (`decision_walking.rs:125–161`; `FieldName` reserves `where`, `evidence_kind_contracts.rs:94–98`), so a caller field named `folder` cannot collide; submits through the shared dispatcher and drains. The response's selected answer's probability ≥ `min_probability` (equality included) → `Judged`; otherwise `Unsure`, even if another answer's probability is higher (native validation doesn't require the selected label to be the largest, `judgment_validation.rs:114–132`); a typed request failure → `Incomplete`.\n- **Gate.** In `run_rulebook_with_dispatcher`'s pair loop (`rulebook_run.rs:77–108`), before the first `walk_decision(.., None)`: no gate → as today; gate → look up the file's answer; `Judged` and named → walk; `Judged` and not named → `NotApplicable { reason: Filter }`; otherwise record a skip and create no result slot. The skip collector keys by (rule, file, filter), so several pieces of one file give one skip. The gate is a separate function `gate_for(rule, answers, file) -> GateOutcome { Walk, Exclude, Skip }` called before the first `walk_decision`; its unit test beside `rulebook_run.rs` uses a test-only walk counter to show excluded and skipped pairs are never walked.\n- **Report.** `LintReport` gains `filter_answers: Vec\u003cFilterAnswerEntry>` and `filter_skips: Vec\u003cFilterSkipEntry>`; `RulePieceResult` gains `reason`. `project_outcome` (`outcome.rs:14–185`): an incomplete answer adds an `IncompletePart` with `FilterIncomplete`; a `NoFolder` skip adds an `IncompletePart` naming the rule and file; an unsure answer joins rule and selection uncertainty in status priority. Human output lists answers and skips; SARIF is unchanged (skips are not results). `report_schema()` and `config_schema()` regenerate from the types.\n\n## Trace\n\n| U | R | E | Owner | Interface | Shape and home | State | Failure | Proof |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| U1 | R1 | E1, E2, E3 | sunstack-rules filter stage | `ask_filters` | `FilterAnswer` | judged / unsure / incomplete | request failure → incomplete | V1 |\n| U1 | R2 | E1 | sunstack-lint filter folders | `resolve_filter_folders`, build inputs | `FilterFolder`, `reads` files | described / undescribed / ambiguous | undescribed or ambiguous → incomplete answer | V2 |\n| U2 | R3 | E4, E3 | sunstack-rules rulebook run | gate before first walk | `OnlyWhenGate`, `NotApplicableReason` | — | — | V3 |\n| U3 | R4 | E5 | sunstack-rules run + sunstack-lint projection | `RulebookRun.skips`, `filter_skips`, status | `FilterSkip` | unsure / incomplete / no_folder | exit 5 / exit 3 | V4 |\n| U2, U4 | R5 | none: unchanged path | sunstack-rules, sunstack-evidence | no gate → existing walk; `Named` → existing match | — | — | — | V5 |\n| U1, U2, U5 | R6 | E1, E2, E4, E6 | admission, evidence loading | `load_checked_rulebook`, `admit_rule_entry`, `load_evidence_project` | `AdmissionRefusal`, `ProjectRefusal { origin }` | — | refused entry skipped; `--check` invalid; an inline refusal names its `inline_rule` config path | V6 |\n| U4 | R7 | none: code review | all changed crates | — | generic names only | — | — | V7 |\n| U1, U3 | R9 | E1, E3 | sunstack-rules filter stage | `ask_filters` with `project_model_view` | `FilterIncomplete` reads variants, `input_cut` | incomplete before any request | absent / unavailable / too large → exit 3 | V9 |\n| U5 | R8 | E6 | sunstack-evidence | `load_evidence_project` with inline rules | `KindMatcher`, `InlineRule` | — | parse failure → refusal at its config path | V8 |\n\n## Order of work\n\n1. Inline rules in `sunstack-evidence` (wire, loader, refusals), with unit tests beside each module.\n2. Filters config and admission (filters, gate refusals).\n3. Folder resolution and build inputs.\n4. Filter stage, gate, `NotApplicableReason`.\n5. Report, status, schema; human output.\n6. Integration journeys (library and process, keyless with `ControlledServer`), a `verify-sunstack-rule` case, CHANGELOG, release 0.7.0 (minor: additive config, report and result fields).\n","reference":"./program-design.md"}</script></ex-markdown>
